# Optional override for a small shared VPS. Credentials and runtime data retain
# the official base compose's private mounts and are never embedded here.
services:
  memory:
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  gateway:
    build:
      args:
        SEREIN_BASE_PATH: ${SEREIN_BASE_PATH:-/ob2/}
    environment:
      SEREIN_BASE_PATH: ${SEREIN_BASE_PATH:-/ob2/}
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
